---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-script
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    set -u

    export PGUSER="${POSTGRES_USER:-postgres}"

    function create_database() {
        local database=$1
        local user=$2
        local password=$3
        echo "Creating database '$database' for user '$user'"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
            CREATE USER $user WITH PASSWORD '$password';
            CREATE DATABASE $database;
            GRANT ALL PRIVILEGES ON DATABASE $database TO $user;
            \c $database
            GRANT ALL ON SCHEMA public TO $user;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO $user;
            ALTER SCHEMA public OWNER TO $user;
    EOSQL
    }

    if [ -n "$N8N_DB_NAME" ]; then
        create_database $N8N_DB_NAME $N8N_DB_USER $N8N_DB_PASSWORD
    fi

    if [ -n "$BASEROW_DB_NAME" ]; then
        create_database $BASEROW_DB_NAME $BASEROW_DB_USER $BASEROW_DB_PASSWORD
    fi

    if [ -n "$METABASE_DB_NAME" ]; then
        create_database $METABASE_DB_NAME $METABASE_DB_USER $METABASE_DB_PASSWORD
    fi

    if [ -n "$SUPABASE_DB_NAME" ]; then
        create_database $SUPABASE_DB_NAME $SUPABASE_DB_USER $SUPABASE_DB_PASSWORD
        # Créer les rôles Supabase nécessaires
        echo "Creating Supabase roles in database '$SUPABASE_DB_NAME'"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d "$SUPABASE_DB_NAME" <<-EOSQL
            -- Créer le rôle anon (utilisateur anonyme)
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
                    CREATE ROLE anon NOLOGIN NOINHERIT;
                END IF;
            END
            \$\$;

            -- Créer le rôle authenticated (utilisateur authentifié)
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
                    CREATE ROLE authenticated NOLOGIN NOINHERIT;
                END IF;
            END
            \$\$;

            -- Créer le rôle service_role (rôle de service)
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
                    CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
                END IF;
            END
            \$\$;

            -- Accorder les permissions de base
            GRANT anon TO $SUPABASE_DB_USER;
            GRANT authenticated TO $SUPABASE_DB_USER;
            GRANT service_role TO $SUPABASE_DB_USER;
    EOSQL
    fi
