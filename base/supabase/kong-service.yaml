---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  labels:
    app: supabase-kong
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: admin
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: supabase-kong
