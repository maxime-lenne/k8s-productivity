---
# base/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Baserow
  - baserow/baserow-deployment.yaml
  - baserow/baserow-service.yaml
  - baserow/baserow-pvc.yaml

  # N8N
  - n8n/n8n-deployment.yaml
  - n8n/n8n-pvc.yaml
  - n8n/n8n-service.yaml

  # Excalidraw
  - excalidraw/excalidraw-deployment.yaml
  - excalidraw/excalidraw-pvc.yaml
  - excalidraw/excalidraw-service.yaml

  # Metabase
  - metabase/metabase-deployment.yaml
  - metabase/metabase-pvc.yaml
  - metabase/metabase-service.yaml

  # Supabase
  - supabase/supabase-secret.yaml
  - supabase/kong-deployment.yaml
  - supabase/kong-service.yaml
  - supabase/postgrest-deployment.yaml
  - supabase/postgrest-service.yaml
  - supabase/gotrue-deployment.yaml
  - supabase/gotrue-service.yaml
  - supabase/storage-deployment.yaml
  - supabase/storage-pvc.yaml
  - supabase/storage-service.yaml
  - supabase/realtime-deployment.yaml
  - supabase/realtime-service.yaml
  - supabase/studio-deployment.yaml
  - supabase/studio-service.yaml

  # PostgreSQL
  - postgresql/postgresql-pvc.yaml
  - postgresql/postgresql-deployment.yaml
  - postgresql/postgresql-service.yaml

  # PostgreSQL Database Initialization
  - postgresql/init-script-configmap.yaml

  # Redis
  - redis/redis-deployment.yaml
  - redis/redis-service.yaml

  # Ingress Nginx Configuration
  - ingress-nginx/ingress-nginx-configmap.yaml

  # Application Ingress (Baserow, N8N, Excalidraw, Metabase, Supabase)
  - apps-ingress.yaml

  # Cert-Manager Issuers
  - cert-managers/letsencrypt-issuer.yaml
  - cert-managers/self-signed-issuer.yaml
