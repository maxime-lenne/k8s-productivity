---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-tls-staging-cert
  namespace: staging  # S'assurer que le namespace est correct
spec:
  secretName: apps-tls-staging-cert
  duration: 2160h  # 90d
  renewBefore: 360h  # 15d
  subject:
    organizations:
      - Maxime
  commonName: baserow.staging.maxime-lenne.fr  # Repris de la ConfigMap STAGING_DOMAIN (ou un domaine principal)
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - baserow.staging.maxime-lenne.fr
    - n8n.staging.maxime-lenne.fr
    - excalidraw.staging.maxime-lenne.fr
    - metabase.staging.maxime-lenne.fr
    - supabase.staging.maxime-lenne.fr
  issuerRef:
    name: letsencrypt-prod  # Utiliser l'issuer de production
    kind: ClusterIssuer
    group: cert-manager.io
